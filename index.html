<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>贪吃蛇</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23111a14'/><circle cx='44' cy='20' r='8' fill='%23ff5a5a'/><rect x='10' y='28' width='36' height='12' rx='6' fill='%237cff6b'/></svg>" />
  <style>
    :root {
      --bg: #0c1210;
      --panel: #15201a;
      --panel-border: #2a3d32;
      --grid: #1c2a22;
      --snake: #7cff6b;
      --snake-dark: #3d9a45;
      --food: #ff5a5a;
      --food-glow: #ff8a7a;
      --text: #e8f0ea;
      --muted: #8aa394;
      --accent: #c8f59a;
      --danger: #ff7a7a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: radial-gradient(1200px 700px at 50% -10%, #1a2c22 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    .shell {
      width: min(100%, 560px);
      display: grid;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      font-size: 28px;
      letter-spacing: 0.08em;
      font-weight: 750;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .stats {
      display: flex;
      gap: 10px;
    }

    .stat {
      min-width: 84px;
      background: color-mix(in srgb, var(--panel) 88%, black);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 8px 12px;
      text-align: right;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    .stat strong {
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }

    .board-wrap {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
      background: #0e1712;
      touch-action: none;
      outline: none;
    }

    .overlay {
      position: absolute;
      inset: 14px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(8, 14, 11, 0.72);
      backdrop-filter: blur(6px);
      text-align: center;
      padding: 24px;
    }

    .overlay.hidden {
      display: none;
      pointer-events: none;
    }

    .overlay h2 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .overlay p {
      color: var(--muted);
      margin-bottom: 18px;
      line-height: 1.6;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      font: inherit;
      font-weight: 700;
      color: #102014;
      background: linear-gradient(180deg, #d8ff9a, var(--snake));
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(124, 255, 107, 0.18);
    }

    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px); }

    button.ghost {
      color: var(--text);
      background: color-mix(in srgb, var(--panel) 88%, black);
      border: 1px solid var(--panel-border);
      box-shadow: none;
      padding: 10px 16px;
    }

    button.ghost:disabled {
      opacity: 0.45;
      cursor: default;
      transform: none;
      filter: none;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    kbd {
      display: inline-block;
      min-width: 1.6em;
      padding: 1px 6px;
      border: 1px solid var(--panel-border);
      border-bottom-width: 2px;
      border-radius: 6px;
      background: #1a271f;
      font-family: inherit;
      font-size: 12px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>贪吃蛇</h1>
        <p class="subtitle">吃到食物变长，撞墙或咬到自己就结束</p>
      </div>
      <div class="stats">
        <div class="stat">
          <span>分数</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span>最高</span>
          <strong id="best">0</strong>
        </div>
        <button id="pauseBtn" class="ghost" type="button" disabled>暂停</button>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="480" height="480" tabindex="0" aria-label="贪吃蛇游戏画布"></canvas>
      <div id="overlay" class="overlay">
        <div>
          <h2 id="overlayTitle">准备好了吗</h2>
          <p id="overlayText">开始后按方向键或 WASD 移动，空格暂停。</p>
          <button id="actionBtn" type="button" tabindex="-1">开始游戏</button>
        </div>
      </div>
    </div>

    <p class="hint">
      键盘：<kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>
      · <kbd>空格</kbd> 或右上角「暂停」<br />
      手机：在棋盘上滑动转向
    </p>
  </div>

  <script>
    const COLS = 20;
    const ROWS = 20;
    const START_MS = 280;
    const MIN_MS = 160;
    const STORAGE_KEY = "snakeBestScore";

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const pauseBtn = document.getElementById("pauseBtn");
    const actionBtn = document.getElementById("actionBtn");

    if (typeof ctx.roundRect !== "function") {
      ctx.roundRect = function (x, y, w, h) {
        this.rect(x, y, w, h);
      };
    }

    const cell = canvas.width / COLS;
    let snake, dir, queued, food, score, best;
    let running, paused, moving, lastTick, stepMs, gameId, paintId;

    best = Number(localStorage.getItem(STORAGE_KEY) || 0);
    bestEl.textContent = String(best);
    gameId = 0;
    paintId = 0;

    function resetGame() {
      const row = Math.floor(ROWS / 2);
      snake = [
        { x: 4, y: row },
        { x: 3, y: row },
        { x: 2, y: row }
      ];
      dir = { x: 1, y: 0 };
      queued = [];
      score = 0;
      stepMs = START_MS;
      lastTick = 0;
      moving = false;
      food = spawnFood();
      scoreEl.textContent = "0";
    }

    function spawnFood() {
      const taken = new Set(snake.map((s) => s.x + "," + s.y));
      let next;
      do {
        next = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
      } while (taken.has(next.x + "," + next.y));
      return next;
    }

    function queueDir(nx, ny) {
      const last = queued.length ? queued[queued.length - 1] : dir;
      const same = last.x === nx && last.y === ny;
      const reverse = last.x + nx === 0 && last.y + ny === 0;
      if (moving && reverse) return;
      if (!same && queued.length < 2) queued.push({ x: nx, y: ny });
      if (running && !paused) {
        moving = true;
        if (!lastTick) lastTick = Date.now();
      }
    }

    function tick() {
      if (queued.length) dir = queued.shift();
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      const hitWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
      const hitSelf = snake.some((s) => s.x === head.x && s.y === head.y);
      if (hitWall || hitSelf) {
        endGame();
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 1;
        scoreEl.textContent = String(score);
        if (score > best) {
          best = score;
          bestEl.textContent = String(best);
          localStorage.setItem(STORAGE_KEY, String(best));
        }
        stepMs = Math.max(MIN_MS, START_MS - score * 2);
        food = spawnFood();
      } else {
        snake.pop();
      }
    }

    function drawRounded(x, y, size, radius, fill) {
      ctx.beginPath();
      ctx.roundRect(x, y, size, size, radius);
      ctx.fillStyle = fill;
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0e1712";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(124, 255, 107, 0.06)";
      ctx.lineWidth = 1;
      for (let i = 1; i < COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cell + 0.5, 0);
        ctx.lineTo(i * cell + 0.5, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * cell + 0.5);
        ctx.lineTo(canvas.width, i * cell + 0.5);
        ctx.stroke();
      }

      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 180);
      const foodPad = 5 - pulse;
      ctx.shadowColor = "#ff8a7a";
      ctx.shadowBlur = 12 + pulse * 8;
      ctx.fillStyle = "#ff5a5a";
      ctx.beginPath();
      ctx.arc(
        food.x * cell + cell / 2,
        food.y * cell + cell / 2,
        (cell - foodPad * 2) / 2,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.shadowBlur = 0;

      snake.forEach((seg, i) => {
        const pad = i === 0 ? 2 : 3.5;
        const radius = i === 0 ? 8 : 7;
        const t = i / Math.max(snake.length - 1, 1);
        const color = i === 0
          ? "#9dff86"
          : `rgb(${70 + (1 - t) * 50}, ${160 + (1 - t) * 70}, ${70 + (1 - t) * 30})`;
        drawRounded(seg.x * cell + pad, seg.y * cell + pad, cell - pad * 2, radius, color);
      });

      const head = snake[0];
      const cx = head.x * cell + cell / 2;
      const cy = head.y * cell + cell / 2;
      const ox = dir.x * 4;
      const oy = dir.y * 4;
      const px = -dir.y * 4.2;
      const py = dir.x * 4.2;
      ctx.fillStyle = "#102014";
      ctx.beginPath();
      ctx.arc(cx + ox + px, cy + oy + py, 2.2, 0, Math.PI * 2);
      ctx.arc(cx + ox - px, cy + oy - py, 2.2, 0, Math.PI * 2);
      ctx.fill();

      if (running && !moving && !paused) {
        ctx.fillStyle = "rgba(232, 240, 234, 0.88)";
        ctx.font = "16px Segoe UI, PingFang SC, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("按方向键开始移动", canvas.width / 2, canvas.height - 26);
      }
    }

    function loop(id) {
      if (!running || id !== gameId) return;
      if (!paused && moving) {
        const now = Date.now();
        if (!lastTick) lastTick = now;
        if (now - lastTick >= stepMs) {
          lastTick = now;
          tick();
        }
      }
      draw();
      paintId = requestAnimationFrame(() => loop(id));
    }

    function focusBoard() {
      actionBtn.blur();
      canvas.focus({ preventScroll: true });
    }

    function showOverlay(title, text, buttonLabel) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      actionBtn.textContent = buttonLabel;
      overlay.classList.remove("hidden");
    }

    function hideOverlay() {
      overlay.classList.add("hidden");
    }

    function setPauseEnabled(on) {
      pauseBtn.disabled = !on;
    }

    function startGame() {
      gameId += 1;
      if (paintId) cancelAnimationFrame(paintId);
      resetGame();
      running = true;
      paused = false;
      hideOverlay();
      setPauseEnabled(true);
      focusBoard();
      paintId = requestAnimationFrame(() => loop(gameId));
    }

    function pauseGame() {
      if (!running || paused) return;
      paused = true;
      setPauseEnabled(false);
      showOverlay("已暂停", "按空格或点击继续。", "继续游戏");
    }

    function resumeGame() {
      if (!running || !paused) return;
      paused = false;
      lastTick = Date.now();
      hideOverlay();
      setPauseEnabled(true);
      focusBoard();
    }

    function endGame() {
      running = false;
      paused = false;
      moving = false;
      setPauseEnabled(false);
      if (paintId) cancelAnimationFrame(paintId);
      paintId = 0;
      draw();
      showOverlay("游戏结束", "本局分数 " + score + " 分。再来一局？", "再来一局");
    }

    const keys = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], a: [-1, 0], s: [0, 1], d: [1, 0],
      W: [0, -1], A: [-1, 0], S: [0, 1], D: [1, 0]
    };

    window.addEventListener("keydown", (event) => {
      const isSpace = event.code === "Space" || event.key === " ";
      if (isSpace) {
        event.preventDefault();
        event.stopPropagation();
        if (!running) startGame();
        else if (paused) resumeGame();
        else pauseGame();
        return;
      }
      const next = keys[event.key];
      if (!next) return;
      event.preventDefault();
      if (!running) startGame();
      queueDir(next[0], next[1]);
    }, true);

    pauseBtn.addEventListener("click", (event) => {
      event.preventDefault();
      pauseGame();
    });

    let swipe = null;
    canvas.addEventListener("pointerdown", (event) => {
      swipe = { x: event.clientX, y: event.clientY };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointerup", (event) => {
      if (!swipe) return;
      const dx = event.clientX - swipe.x;
      const dy = event.clientY - swipe.y;
      swipe = null;
      if (Math.hypot(dx, dy) < 24) return;
      if (!running) startGame();
      if (Math.abs(dx) > Math.abs(dy)) queueDir(dx > 0 ? 1 : -1, 0);
      else queueDir(0, dy > 0 ? 1 : -1);
    });

    actionBtn.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      if (paused && running) resumeGame();
      else startGame();
    });

    resetGame();
    draw();
  </script>
</body>
</html>
